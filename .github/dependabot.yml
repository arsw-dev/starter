version: 2

# Weekly, each update 3 days after its release, so it passes minimumReleaseAge
updates:
  # The catalogs in pnpm-workspace.yaml. Minor and patch updates come
  # together; each major gets its own PR, to read on its own
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # A 7.1 nightly, for the editor's import completions, held until 7.1
    # ships; then the stable 7.1 replaces it and this goes
    ignore:
      - dependency-name: typescript
  # The SHA pins in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
