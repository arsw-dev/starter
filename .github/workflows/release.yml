name: Release

# A pull request from main merged into release is a release. Two jobs:
# Package builds every package whose version hasn't been released yet, from the
# merged commit with no credentials. Publish, once a reviewer approves it in the
# npm-publish environment, stages those tarballs on npm, then tags each version
# and creates its GitHub Release. A staged version goes live only once a
# maintainer approves it on npm with 2FA, so neither this workflow nor the
# GitHub account behind it can publish alone. No token is stored: each package
# trusts this workflow's runs in that environment (trusted publishing), and npm
# adds provenance

on:
  push:
    branches: [release]

# One release at a time, and never one cancelled halfway through publishing
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      count: ${{ steps.pack.outputs.count }}

    env:
      # The install's prepare would set up git hooks, unused here
      VP_GIT_HOOKS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version in package.json's packageManager
      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "./packages/*" --if-present run build

      # Each package whose version has no GitHub Release yet: its tarball (pnpm
      # pack writes the workspace: and catalog: versions out) and its changelog
      # section, the release's notes. The Release is made once the version is
      # staged, so one waiting for approval on npm isn't staged again, which npm
      # refuses. In folder order, which puts guardrails before vite-config,
      # which depends on it
      - name: Pack
        id: pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          count=0

          for manifest in packages/*/package.json; do
            dir=$(dirname "$manifest")
            folder=$(basename "$dir")
            name=$(node -p "require('./$manifest').name")
            version=$(node -p "require('./$manifest').version")

            if [[ $(node -p "require('./$manifest').private ?? false") == true ]]; then
              continue
            fi

            if gh release view "$folder@$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$name@$version is already released"
              continue
            fi

            awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found' \
              "$dir/CHANGELOG.md" > "release/$folder.md"

            if [[ ! -s "release/$folder.md" ]]; then
              echo "::error::$dir/CHANGELOG.md has no '## $version' section"
              exit 1
            fi

            tarball=$(cd "$dir" && pnpm pack --pack-destination ../../release | tail -1)
            echo "$folder $name $version $(basename "$tarball")" >> release/packages.txt
            count=$((count + 1))
          done

          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Keep the Packages
        if: steps.pack.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: needs.package.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      # The tags and the GitHub Releases
      contents: write
      # Trusted publishing
      id-token: write

    steps:
      # npm 11.5.1 or later publishes as a trusted publisher; Node 26's has it.
      # Nothing is installed here, so no dependency runs where the publish is
      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Fetch the Packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # A version npm already has live is skipped, so a re-run after a failure
      # finishes the job
      - name: Stage, Tag and Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while read -r folder name version tarball; do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              # ./ makes it a path: npm reads release/<file> as a GitHub repo
              npm stage publish "./release/$tarball" --access public
            fi

            if gh release view "$folder@$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$folder@$version is already released"
            else
              gh release create "$folder@$version" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$name $version" \
                --notes-file "release/$folder.md"
            fi
          done < release/packages.txt
