name: CI

on:
  pull_request:
    branches: [main]

# A new push to a pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # The check to read before merging; main's ruleset requires it
    name: CI Result
    runs-on: ubuntu-latest
    env:
      # The install's prepare would set up git hooks, unused here
      VP_GIT_HOOKS: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version in package.json's packageManager
      - name: Set Up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set Up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install
        id: install
        run: pnpm install --frozen-lockfile
      # Each check runs even when the one before it failed, so one run shows
      # every problem
      - name: Check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vp check
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec vp test
      # Each API's committed document matches its routes, so a change to an API
      # arrives with the change to its contract
      - name: OpenAPI Documents
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm --recursive --if-present run openapi
          if [ -n "$(git status --porcelain -- '*openapi.json')" ]; then
            echo "Run pnpm openapi in each API and commit its openapi.json:"
            git status --short -- '*openapi.json'
            git diff -- '*openapi.json'
            exit 1
          fi
