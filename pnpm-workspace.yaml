# Front ends, back ends, and the shared code they're built from
packages:
  - apps/*
  - services/*
  - packages/*

# Supply chain
minimumReleaseAge: 4320 # 3 days: most malicious releases are pulled by then
trustPolicy: no-downgrade # a package that published with provenance can't stop
blockExoticSubdeps: true # subdependencies: registry only, no git or tarballs
strictDepBuilds: true # install scripts run only if allowBuilds approves them

# One exact version of each dependency, from a catalog
catalogMode: strict
catalogPrune: true # drops entries nothing uses
savePrefix: '' # no ^

engineStrict: true # install fails on a Node older than package.json's engines

catalogs:
  # Front-end dependencies
  app:
    '@cloudflare/vite-plugin': 1.64.0
    '@hookform/resolvers': 5.9.2
    '@tailwindcss/vite': 4.3.3
    '@tanstack/devtools-vite': 0.8.5
    '@tanstack/react-devtools': 0.10.13
    '@tanstack/react-query': 5.104.4
    '@tanstack/react-query-devtools': 5.104.4
    '@tanstack/react-router': 1.170.45
    '@tanstack/react-router-devtools': 1.167.2
    '@tanstack/react-router-ssr-query': 1.167.3
    '@tanstack/react-start': 1.169.3
    '@types/react': 19.3.0
    '@types/react-dom': 19.3.0
    '@vitejs/plugin-react': 6.1.2
    oxc-transform-react: 0.152.0
    radix-ui: 1.8.1
    react: 19.3.1
    react-dom: 19.3.1
    react-hook-form: 7.90.0
    sonner: 2.0.8
    tailwindcss: 4.3.3
    zustand: 5.0.15

  api:
    '@hono/zod-openapi': 1.6.3
    drizzle-orm: 0.45.4
    hono: 4.13.13

  shared:
    zod: 4.6.7

  # The toolchain and the runtimes' types
  tooling:
    '@cloudflare/vitest-plugin': 1.4.4
    '@testing-library/dom': 10.4.2
    '@testing-library/react': 16.3.3
    '@testing-library/user-event': 14.6.8
    '@types/node': 26.6.5
    drizzle-kit: 0.31.11
    jsdom: 30.1.3
    oxlint: 1.88.0
    typescript: 7.1.0-dev.20261016.1 # the editor's, until 7.1 ships
    vite-plus: 1.2.0
    wrangler: 4.151.1

# Versions forced on dependencies of dependencies
overrides:
  # Babel 7 (in TanStack's compiler) asks for semver ^6, and 6.3.1 has no
  # provenance while earlier-published 7.x releases do, so trustPolicy refuses
  # it. Babel uses only semver's comparisons, which 7 keeps
  'semver@^6': 7.8.5
  # Vite+ ships its own Vite: every plugin gets that copy, not a second one
  vite: 'npm:@voidzero-dev/vite-plus-core@1.2.0'

allowBuilds:
  esbuild: true # downloads its platform's binary
  workerd: true # downloads its platform's binary
